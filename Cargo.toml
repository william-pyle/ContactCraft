[workspace]
members = [".", "store"]

[package]
name = "contactcraft"
version = "1.2.4"
edition = "2024"
description = "ContactCraft: contacts and groups on Windows, shared with other applications"
repository = "https://github.com/william-pyle/ContactCraft"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "ContactCraft"
path = "src/main.rs"

[dependencies]
contactcraft-store = { path = "store" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
